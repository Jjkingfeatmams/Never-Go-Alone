<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Never Go Alone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --ink: #f8f6fb;
      --muted: #b9b4c2;
      --paper: #111117;
      --card: #1b1b24;
      --line: #343440;
      --brand: #ad99ff;
      --brand-soft: #2d2941;
      --coral: #ff7365;
      --green: #6fe0a0;
      --green-soft: #173d31;
      --gold: #f0c664;
      --shadow: 0 24px 64px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      background: #09090d;
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid #f2a64a;
      outline-offset: 3px;
    }

    .stage {
      min-height: 100vh;
      min-height: 100svh;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px minmax(0, 1fr);
      align-items: center;
      gap: 48px;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 22%, rgba(128, 96, 255, .22), transparent 31%),
        radial-gradient(circle at 77% 72%, rgba(255, 107, 94, .11), transparent 28%),
        #09090d;
    }

    .intro { max-width: 290px; justify-self: end; }
    .intro small { color: var(--brand); font-weight: 800; letter-spacing: .12em; }
    .intro h1 {
      margin: 10px 0;
      font: 720 48px/.9 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -.065em;
    }
    .intro em { color: var(--brand); font-style: normal; }
    .intro p, .side { color: var(--muted); line-height: 1.55; }
    .side { max-width: 190px; }

    .phone {
      position: relative;
      width: 420px;
      height: 874px;
      padding: 5px;
      border: 10px solid #24242d;
      border-radius: 54px;
      background: #24242d;
      box-shadow: var(--shadow);
      transform: scale(var(--phone-scale, 1));
      transform-origin: center;
    }

    .notch {
      position: absolute;
      z-index: 5;
      top: 5px;
      left: calc(50% - 63px);
      width: 126px;
      height: 28px;
      border-radius: 0 0 18px 18px;
      background: #24242d;
    }

    #app {
      height: 100%;
      overflow: hidden;
      border-radius: 39px;
      background: var(--paper);
    }

    .view {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .screen-header {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      min-height: 76px;
      padding: 32px 16px 8px;
    }

    .screen-header strong { text-align: center; font-size: 13px; }
    .header-spacer { width: 36px; height: 36px; }
    .home-header { grid-template-columns: 86px 1fr 40px; }
    .home-button {
      min-height: 36px;
      padding: 0 9px;
      border: 0;
      border-radius: 18px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
    }
    .icon-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 22px;
      line-height: 1;
    }

    .explore-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 39px 20px 10px;
    }

    .eyebrow {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: 8px;
      font: 720 26px/1.02 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -.045em;
    }
    h2 { margin-bottom: 7px; font: 680 17px/1.1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.025em; }
    h3 { margin-bottom: 5px; font: 650 16px/1.12 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.02em; }
    .muted { color: var(--muted); line-height: 1.45; }
    .tiny { font-size: 11px; }

    .location-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px 12px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #f0eae5;
      color: #514a57;
      font-size: 12px;
      font-weight: 600;
    }

    .location-bar button {
      margin-left: auto;
      padding: 2px 0;
      border: 0;
      background: none;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }

    .scroll {
      flex: 1;
      overflow: auto;
      padding: 0 20px 88px;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .scroll::-webkit-scrollbar { display: none; }

    .welcome-screen {
      background:
        radial-gradient(circle at 95% 2%, rgba(255, 115, 101, .28), transparent 28%),
        radial-gradient(circle at 5% 22%, rgba(173, 153, 255, .27), transparent 35%),
        var(--paper);
    }
    .welcome-scroll { padding: 48px 20px 32px; }
    .welcome-screen .screen-header + .welcome-scroll { padding-top: 16px; }
    .welcome-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--brand);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .11em;
    }
    .welcome-screen h1 { margin: 18px 0 11px; font-size: 37px; line-height: .93; }
    .welcome-lead { margin-bottom: 17px; color: var(--muted); font-size: 14px; line-height: 1.52; }
    .welcome-language { margin: 15px 0 0; }
    .welcome-steps { display: grid; gap: 9px; margin: 17px 0; }
    .welcome-step {
      display: grid;
      grid-template-columns: 29px 1fr;
      gap: 10px;
      align-items: start;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }
    .welcome-step-number {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 900;
    }
    .welcome-step b { display: block; font-size: 12px; }
    .welcome-step p { margin: 2px 0 0; color: var(--muted); font-size: 11px; line-height: 1.38; }
    .welcome-cta { margin-top: 15px; }
    .welcome-secondary { margin-top: 9px; }

    .onboarding-profile {
      position: relative;
      margin: 18px 0 16px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--brand) 38%, var(--line));
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 115, 101, .15), transparent 33%),
        linear-gradient(145deg, color-mix(in srgb, var(--brand-soft) 86%, var(--card)), var(--card));
    }
    .onboarding-profile-head { display: flex; gap: 10px; align-items: flex-start; }
    .onboarding-profile-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 12px;
      background: color-mix(in srgb, var(--brand) 22%, var(--card));
      font-size: 18px;
    }
    .onboarding-profile h2 { margin: 1px 0 3px; font-size: 19px; }
    .onboarding-profile-head p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.42; }
    .onboarding-profile .field { margin: 12px 0 0; }
    .onboarding-profile .two-columns { margin-top: 1px; }
    .onboarding-feedback { min-height: 18px; margin: 6px 0 0; color: #e78e84; font-size: 11px; font-weight: 700; }

    .interest-picker {
      margin: 21px 0 14px;
      padding: 15px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--brand) 38%, var(--line));
      border-radius: 22px;
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 115, 101, .16), transparent 33%),
        linear-gradient(145deg, color-mix(in srgb, var(--brand-soft) 86%, var(--card)), var(--card));
    }
    .interest-picker-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .interest-picker h2 { margin: 0; font-size: 20px; }
    .interest-picker p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.42; }
    .interest-count {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, .08);
      color: var(--brand);
      font-size: 10px;
      font-weight: 800;
    }
    .interest-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    .interest-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 49px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 8, 12, .22);
      color: var(--ink);
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .interest-choice:hover { transform: translateY(-1px); border-color: var(--brand); }
    .interest-choice:active { transform: scale(.98); }
    .interest-choice.selected {
      border-color: var(--brand);
      background: color-mix(in srgb, var(--brand) 19%, var(--card));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent);
    }
    .interest-choice .interest-icon {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      background: color-mix(in srgb, var(--brand) 22%, var(--card));
      font-size: 15px;
    }
    .interest-choice b { font-size: 11px; line-height: 1.15; }
    .interest-choice small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .interest-footnote { margin: 12px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .welcome-skip {
      display: block;
      width: 100%;
      margin: 10px 0 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin: 0 -20px 14px;
      padding: 0 20px;
      scrollbar-width: none;
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: var(--card);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .chip.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .age-preference {
      margin: 15px 0;
      padding: 13px;
      border: 1px solid #dcd5ee;
      border-radius: 14px;
      background: var(--brand-soft);
    }
    .age-preference b { display: block; font-size: 12px; }
    .age-preference p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .age-preference .filters { margin: 10px -13px 0; padding: 0 13px; }

    .event-list { display: grid; gap: 12px; }

    .event-card {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 12px 24px rgba(0, 0, 0, .15);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .event-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 70%, var(--line)); box-shadow: 0 18px 31px rgba(0, 0, 0, .25); }
    .event-card:active { transform: scale(.99); }

    .event-poster {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      min-height: 145px;
      padding: 13px;
      overflow: hidden;
      color: #fff;
      isolation: isolate;
    }

    .event-poster::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(110deg, rgba(20, 16, 34, .76), rgba(20, 16, 34, .1) 60%, rgba(12, 9, 19, .58));
      content: "";
    }
    .event-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .event-artwork.contain { padding: 15px; object-fit: contain; background: radial-gradient(circle, rgba(255, 255, 255, .22), rgba(13, 25, 47, .9)); }
    .matchup-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 22px;
      background: radial-gradient(circle at center, #427e9d, #172b4b 68%);
    }
    .matchup-artwork img { width: min(33%, 92px); max-height: 76px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); }
    .matchup-artwork span { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
    .event-poster small,
    .event-poster b {
      position: relative;
      z-index: 2;
    }
    .event-poster b {
      max-width: 230px;
      font: 720 27px/.93 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -.055em;
      text-align: right;
    }

    .event-poster {
      background-position: center;
      background-size: cover;
    }
    .concert {
      background-image: linear-gradient(110deg, rgba(28, 22, 62, .78), rgba(108, 39, 73, .18), rgba(15, 11, 30, .58)), url("assets/concert-live.png");
    }
    .sport {
      background-image: linear-gradient(110deg, rgba(12, 53, 71, .8), rgba(22, 100, 105, .13), rgba(9, 25, 44, .53)), url("assets/sport-run.png");
    }
    .football {
      background-image: linear-gradient(110deg, rgba(8, 21, 55, .82), rgba(88, 15, 31, .14), rgba(4, 10, 28, .58)), url("assets/football-derby.png");
    }
    .theatre {
      background-image: linear-gradient(110deg, rgba(47, 13, 25, .79), rgba(104, 33, 33, .13), rgba(19, 9, 13, .56)), url("assets/theatre-stage.png");
    }
    .club {
      background-image: linear-gradient(110deg, rgba(16, 12, 47, .81), rgba(72, 28, 113, .12), rgba(24, 12, 45, .57)), url("assets/club-night.png");
    }
    .festival {
      background-image: linear-gradient(110deg, rgba(83, 37, 15, .73), rgba(134, 57, 18, .1), rgba(53, 21, 8, .53)), url("assets/festival-outdoor.png");
    }
    .humour {
      background-image: linear-gradient(110deg, rgba(48, 26, 12, .79), rgba(99, 43, 15, .1), rgba(29, 15, 8, .55)), url("assets/comedy-night.png");
    }

    .event-copy { padding: 13px 14px 14px; }
    .event-match {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0 0 6px;
      border-radius: 999px;
      padding: 4px 7px;
      background: color-mix(in srgb, var(--brand) 20%, var(--card));
      color: var(--brand);
      font-size: 9px;
      font-weight: 800;
    }
    .event-copy p { margin-bottom: 8px; color: var(--muted); font-size: 11px; }
    .price-line { display: flex; align-items: baseline; gap: 7px; }
    .price-line b { color: var(--brand); }
    .price-line s { color: var(--muted); font-size: 11px; }
    .progress {
      height: 7px;
      margin: 10px 0 7px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in srgb, var(--coral) 16%, var(--card));
    }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--coral); }
    .event-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; }
    .member-dots { color: var(--brand); letter-spacing: -2px; }
    .live-note { margin: -3px 0 14px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .discover-hero {
      position: relative;
      margin: 0 0 16px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--brand) 44%, var(--line));
      border-radius: 20px;
      background:
        radial-gradient(circle at 92% 10%, rgba(255, 115, 101, .30), transparent 30%),
        radial-gradient(circle at 15% 100%, rgba(173, 153, 255, .31), transparent 38%),
        linear-gradient(135deg, #252139, #161622 70%);
      isolation: isolate;
    }
    .discover-hero::after {
      position: absolute;
      z-index: -1;
      right: -52px;
      bottom: -66px;
      width: 164px;
      height: 164px;
      border: 20px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      content: "";
    }
    .discover-eyebrow { display: block; margin-bottom: 6px; color: #d7ccff; font-size: 10px; font-weight: 900; letter-spacing: .1em; }
    .discover-hero h2 { max-width: 235px; margin: 0; color: #fff; font-size: 23px; }
    .discover-hero p { max-width: 285px; margin: 7px 0 0; color: #d1cbd7; font-size: 11px; line-height: 1.42; }
    .discover-hero button {
      margin-top: 13px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(10, 10, 16, .22);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }
    .explore-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 0 10px; }
    .explore-section-title h2 { margin: 0; }
    .explore-section-title span { color: var(--muted); font-size: 10px; }
    .source-link { display: inline-flex; margin: -2px 0 5px; color: var(--brand); font-size: 11px; font-weight: 800; text-decoration: none; }
    .source-link:hover { text-decoration: underline; }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 66px;
      padding: 7px 9px;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .bottom-nav button {
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .bottom-nav button.active { color: var(--brand); background: var(--brand-soft); }

    .hero-poster { margin: 0 0 17px; border-radius: 18px; }
    .info-card, .notice-card, .profile-card, .private-lock {
      margin: 14px 0;
      padding: 13px;
      border-radius: 14px;
      background: #f1ebe6;
    }
    .info-card p, .notice-card p, .profile-card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .profile-inline-action {
      margin-top: 10px;
      border: 0;
      border-bottom: 1px solid currentColor;
      padding: 0 0 2px;
      background: none;
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
    }
    .private-lock { border: 1px solid #ddd3ff; background: var(--brand-soft); color: #39306f; }
    .private-lock p { margin: 4px 0 0; font-size: 12px; line-height: 1.4; }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
    }
    .primary.coral { background: var(--coral); }
    .primary.gold { background: linear-gradient(135deg, #b47814, #f2cf6b); color: #3a2500; }
    .primary.ghost { border: 1px solid var(--brand); background: transparent; color: var(--brand); }
    .fixed-action { position: absolute; right: 20px; bottom: 16px; left: 20px; }

    .member-list { display: grid; }
    .member-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 11px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .member-row > span:nth-child(2) { min-width: 0; flex: 1; }
    .member-row b { display: block; font-size: 13px; }
    .member-row p { margin: 3px 0 0; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .live-member-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .verified-badge {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 6px;
      border: 1px solid rgba(79, 140, 255, .35);
      background: rgba(79, 140, 255, .13);
      color: #2a6cc7;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }
    .verification-icon, .profile-verification-icon {
      display: inline-grid;
      width: 14px;
      height: 14px;
      place-items: center;
      border-radius: 50%;
      background: #3e83f3;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      vertical-align: middle;
    }
    .profile-verification-icon {
      width: 19px;
      height: 19px;
      margin-left: 3px;
      font-size: 12px;
      transform: translateY(-1px);
    }

      async function loadLiveEvent(event) {
        if (!event || live.loadingEvent[event.id]) return;
        live.loadingEvent[event.id] = true;
        try {
          var payload = await apiRequest("/api/events/" + encodeURIComponent(event.id) + "/interests");
          applyLiveEvent(event, payload);
          live.countsLoaded = true;
          live.error = "";
        } catch (error) {
          live.error = error && error.message ? error.message : "";
        } finally {
          delete live.loadingEvent[event.id];
          liveRefreshView();
        }

      function withdrawalStorageKey(event) {
        return "never-go-alone:withdraw:" + event.id;

      function rememberWithdrawal(event, memberId, token) {
        try {
          // A withdrawal token is sensitive. Keep it for this browser tab
          // only, never across a copied link or a future browser session.
          var key = withdrawalStorageKey(event);
          localStorage.removeItem(key);
          sessionStorage.setItem(key, JSON.stringify({ memberId: memberId, token: token }));
        } catch (error) { /* The live join remains valid if browser storage is unavailable. */ }
      }

      function rememberedWithdrawal(event) {
        try {
          var key = withdrawalStorageKey(event);
          // Delete a persistent token left by an older version. It must not
          // be reused if someone opens the same URL later.
          localStorage.removeItem(key);
          var raw = sessionStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (error) { return null; }
      }

      function clearRememberedWithdrawal(event) {
        try {
          var key = withdrawalStorageKey(event);
          localStorage.removeItem(key);
          sessionStorage.removeItem(key);
        } catch (error) { /* no-op */ }
      }

      function eventInterestBadge(event) {

      function rankedEvents(list) {

          return {
            event: event,
            index: index,
            score: firstMatch ? 100 - preferenceIndex * 5 : 0,
            live: liveCount(event)

        }).sort(function (left, right) {
          return right.score - left.score || right.live - left.live || left.index - right.index;

      function ticketTab() {
        var event = groupEvent();
        var reservation = activeReservation();
        var confirmed = reservation.keepSmallGroup || event.current >= event.minimum;
        var paymentAvailable = confirmed && reservation.day === "J-7" && !reservation.paid;
        var steps = [
          ["Intérêt enregistré", true],
          ["Groupe lancé", confirmed],
          ["Confirmation à J-7", reservation.day === "J-7"],
          ["Billet", reservation.paid]
        ];
        var html = "<div class='scroll'><div class='timeline'>" + steps.map(function (step) {
          return "<div class='timeline-step " + (step[1] ? "done" : "") + "'>" + step[0] + "</div>";
        }).join("") + "</div><div class='field'><label for='simulation-day'>Simuler la date</label>" +
          "<select id='simulation-day'><option value='J-14'" + (reservation.day === "J-14" ? " selected" : "") + ">J-14</option>" +
          "<option value='J-7'" + (reservation.day === "J-7" ? " selected" : "") + ">J-7</option></select></div>";

        if (!confirmed) {
          html += "<div class='status neutral'>Le groupe peut choisir d'y aller même sans atteindre le tarif groupe.</div>" +
            "<button type='button' class='primary' data-action='keep-small'>On maintient la sortie à " + event.current + "</button>";

          html += "<div class='status'>✓ Billet confirmé. Rendez-vous 30 min avant l'événement.</div>" +
            "<div class='qr' aria-label='QR code fictif'>NGA-2026</div>";

        html += "<button type='button' class='primary ghost' style='margin-top:10px' data-action='leave'>Quitter le groupe</button>";
        if (reservation.leaveMessage) html += "<div class='notice-card'><b>Avant de quitter</b><p>" + esc(reservation.leaveMessage) + "</p></div>";

        var finalLabel = isLanding ? i18n("✨ Créer mon profil", "✨ Create my profile") : i18n("✨ Créer ou modifier mon profil", "✨ Create or edit my profile");
        return "<section class='view " + (isLanding ? "landing-screen" : "") + "'>" + (isLanding ? "" : header(i18n("À propos", "About"))) + "<div class='scroll about-scroll" + (isLanding ? "" : " with-bottom-nav") + "'>" +
          "<section class='about-story-hero " + (isLanding ? "landing-hero" : "") + "'>" + (isLanding ? languagePicker("landing-language") : "") + "<span class='about-story-kicker'>✨ " + esc(i18n("NOTRE HISTOIRE", "OUR STORY")) + "</span><h1>" + esc(i18n("Une sortie, des gens qui ont envie d’y aller aussi.", "One event, people who want to go too.")) + "</h1><p>" + esc(i18n("Never Go Alone s’adresse aux personnes qui ont envie de sortir, de rencontrer du monde et de partager un événement sans y aller seules.", "Never Go Alone is for people who want to go out, meet others and share an event without going alone.")) + "</p><span class='scroll-hint'>↓ " + esc(i18n("Fais défiler", "Keep scrolling")) + "</span></section>" +
          chapters.map(function (chapter) {
            return "<article class='about-chapter' data-reveal data-tone='" + esc(chapter.tone) + "'><span class='about-number' aria-hidden='true'>" + esc(chapter.emoji) + "</span><h2>" + esc(chapter.title) + "</h2><p>" + esc(chapter.text) + "</p><span class='about-orb' aria-hidden='true'></span></article>";
          }).join("") +
          "<div class='private-lock'><b>🔒 " + esc(i18n("Un prototype qui écoute", "A prototype that listens")) + "</b><p>" + esc(i18n("Cette version sert à mesurer l’intérêt avant le lancement. Les coordonnées ne sont demandées qu’au moment où tu rejoins une sortie, jamais pour explorer.", "This version measures interest before launch. Contact details are requested only when you join an event, never while you explore.")) + "</p></div>" +
          "<div class='private-lock verification-card'><b>🪪 " + esc(i18n("Une identité vérifiée au lancement", "Identity verification at launch")) + "</b><p>" + esc(i18n("Dans la version finale, les profils seront vérifiés avec une pièce d’identité. Ce prototype n’en demande ni n’en conserve aucune.", "In the final version, profiles will be verified with government-issued ID. This prototype neither requests nor stores any identity document.")) + "</p></div>" +
          "<button type='button' class='primary coral about-final' data-action='" + finalAction + "'>" + esc(finalLabel) + "</button></div>" + (isLanding ? "" : bottomNav("about")) + "</section>";
      }

      function landing() {
        return aboutStory(true);
      }

      function about() {
        return aboutStory(false);
      }

      function cityPage() {
        return "<section class='view'>" + header("Changer de ville") + "<div class='scroll'><h1>Où veux-tu sortir ?</h1>" +
          "<p class='muted'>Choisis une ville en France pour voir les sorties proposées.</p>" +
          Object.keys(venues).map(function (city) {
            return "<button type='button' class='city-row' data-action='select-city' data-city='" + esc(city) + "'>" +
              "<b>" + esc(city) + "</b><span>" + (city === state.city ? "Choisie ✓" : "Voir les sorties ›") + "</span></button>";
          }).join("") + "</div></section>";
      }

      function revealAboutChapters() {
        var chapters = Array.prototype.slice.call(app.querySelectorAll("[data-reveal]"));
        if (!chapters.length) return;
        if (!("IntersectionObserver" in window)) {
          chapters.forEach(function (chapter) { chapter.classList.add("is-visible"); });
          return;
        }
        var scrollRoot = app.querySelector(".about-scroll");
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, { root: scrollRoot, threshold: .16 });
        chapters.forEach(function (chapter) { observer.observe(chapter); });
      }

      function render() {
        document.body.classList.toggle("dark", state.dark);
        var views = {
          landing: landing,
          welcome: welcome,
          explore: explore,
          event: eventDetail,
          people: peoplePreview,
          "member-profile": memberProfile,
          join: joinPage,
          contact: contactPage,
          profile: profile,
          about: about,
          city: cityPage
        };
        app.innerHTML = (views[state.screen] || explore)();
        applyLocale();
        window.requestAnimationFrame(revealAboutChapters);
      }

      app.addEventListener("click", function (event) {
        var control = event.target.closest("[data-action]");
        if (!control) return;
        var action = control.dataset.action;

        if (action === "back") back();
        if (action === "home") {
          state.history = [];
          state.screen = "explore";
          render();
        }
        if (action === "toggle-interest") toggleInterest(control.dataset.interestId || "");
        if (action === "skip-interests") {
          state.interests = [];
          persistInterests();
          render();
        }
        if (action === "start-onboarding") {
          state.profileDraft = Object.assign({}, state.profileDraft || state.personalProfile || normalisePersonalProfile({}));
          navigate("welcome");
        }
        if (action === "edit-interests" || action === "edit-profile") {
          state.profileDraft = Object.assign({}, state.personalProfile || normalisePersonalProfile({}));
          navigate("welcome");
        }
        if (action === "start-exploring") navigate("welcome");
        if (action === "nav") switchMainScreen(control.dataset.screen);
        if (action === "explore") navigate("explore");
        if (action === "profile") navigate("profile");
        if (action === "city") navigate("city");
        if (action === "select-city") selectCity(control.dataset.city);
        if (action === "filter") { state.filter = control.dataset.filter || "Tout"; render(); }
        if (action === "open-event") {
          var eventId = Number(control.dataset.eventId);
          if (Number.isInteger(eventId) && events[eventId]) {
            state.eventIndex = eventId;
            navigate("event");
            loadLiveEvent(selectedEvent());
          }
        }
        if (action === "people") {
          navigate("people");
          loadLiveEvent(selectedEvent());
        }
        if (action === "open-member") openMemberProfile(control.dataset.memberId);
        if (action === "set-age-preference") {
          var selectedAgePreference = control.dataset.agePreference || "all";
          state.agePreference = ["all", "18-23", "24-26", "27-30"].indexOf(selectedAgePreference) >= 0 ? selectedAgePreference : "all";
          render();
        }
        if (action === "join") navigate("join");
        if (action === "withdraw" && window.confirm(i18n("Retirer ton intérêt de ce groupe ? Ton profil ne sera plus visible aux autres personnes intéressées.", "Remove your interest from this group? Your profile will no longer be visible to the other interested people."))) withdrawLiveInterest();
        if (action === "about") navigate("about");
        if (action === "toggle-dark") { state.dark = !state.dark; render(); }
        if (action === "set-locale") {
          state.locale = control.dataset.locale === "en" ? "en" : "fr";
          render();
        }
      });

      app.addEventListener("input", function (event) {
        var input = event.target;
        var onboardingKeys = {
          "onboarding-first-name": "firstName",
          "onboarding-last-name": "lastName",
          "onboarding-age": "age"
        };
        if (onboardingKeys[input.id]) {
          state.profileDraft[onboardingKeys[input.id]] = input.value;
        }
        if (input.id === "card-number") {
          input.value = input.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
        }
        if (input.id === "card-expiry") {
          var expiry = input.value.replace(/\D/g, "").slice(0, 4);
          input.value = expiry.length > 2 ? expiry.slice(0, 2) + "/" + expiry.slice(2) : expiry;
        }
        if (input.id === "card-cvc") input.value = input.value.replace(/\D/g, "").slice(0, 3);
      });

      app.addEventListener("change", function (event) {
        if (event.target.id === "onboarding-gender") {
          state.profileDraft.gender = event.target.value;
        }
        if (event.target.id === "simulation-day") {
          var ticketGroup = activeReservation();
          if (!ticketGroup) return;
          ticketGroup.day = event.target.value;
          ticketGroup.leaveMessage = "";
          render();
        }
      });

      app.addEventListener("submit", function (event) {
        if (event.target && event.target.id === "onboarding-form") {
          event.preventDefault();
          submitOnboardingProfile();
        }
        if (event.target && event.target.id === "live-interest-form") {
          event.preventDefault();
          submitLiveInterest();
        }
      });

      function onboardingFieldValue(id) {
        var input = app.querySelector("#" + id);
        return input ? String(input.value || "").trim() : "";
      }

      function setOnboardingFeedback(message) {
        var feedback = app.querySelector("#onboarding-feedback");
        if (feedback) feedback.textContent = message || "";
      }

      function submitOnboardingProfile() {
        var profileData = normalisePersonalProfile({
          firstName: onboardingFieldValue("onboarding-first-name"),
          lastName: onboardingFieldValue("onboarding-last-name"),
          age: onboardingFieldValue("onboarding-age"),
          gender: onboardingFieldValue("onboarding-gender")
        });
        if (!profileData.firstName || !profileData.lastName || !profileData.age) {
          setOnboardingFeedback(i18n("Renseigne ton prénom, ton nom et ton âge (18–30 ans) pour continuer.", "Enter your first name, last name and age (18–30) to continue."));
          return;
        }
        state.personalProfile = profileData;
        state.profileDraft = Object.assign({}, profileData);
        persistPersonalProfile();
        startExploring();
      }

      function joinFieldValue(id) {
        var input = app.querySelector("#" + id);
        return input ? String(input.value || "").trim() : "";
      }

      function setJoinFeedback(message) {
        var feedback = app.querySelector("#live-join-feedback");
        if (feedback) feedback.textContent = message || "";
      }

      async function submitLiveInterest() {
        var form = app.querySelector("#live-interest-form");
        if (!form || state.joinStatus === "sending") return;
        var firstName = joinFieldValue("live-first-name");
        var lastName = joinFieldValue("live-last-name");
        var email = joinFieldValue("live-email").toLowerCase();
        var age = Number(joinFieldValue("live-age"));
        var nationality = joinFieldValue("live-nationality");
        var activity = joinFieldValue("live-activity");
        var description = joinFieldValue("live-description");
        var passions = joinFieldValue("live-passions");
        var gender = joinFieldValue("live-gender") || "unspecified";
        var website = joinFieldValue("live-website");
        var adult = !!(app.querySelector("#live-adult") || {}).checked;
        var publicConsent = !!(app.querySelector("#live-public-consent") || {}).checked;
        var contactConsent = !!(app.querySelector("#live-contact-consent") || {}).checked;
        var emailLooksValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        if (!firstName || !lastName || !activity || !emailLooksValid || !Number.isInteger(age) || age < 18 || age > 30 || !nationality) {
          setJoinFeedback(i18n("Renseigne ton prénom, ton nom, ton e-mail, ton âge (18–30 ans), ta nationalité et ton activité.", "Enter your first name, last name, email, age (18–30), nationality and activity."));
          return;
        }
        if (!adult || !publicConsent || !contactConsent) {
          setJoinFeedback(i18n("Confirme les trois cases pour envoyer ton formulaire.", "Confirm all three checkboxes to send your form."));
          return;
        }

        state.joinStatus = "sending";
        setJoinFeedback(i18n("Envoi du formulaire et ajout de ton profil…", "Sending your form and adding your profile…"));
        var submitButton = form.querySelector("button[type='submit']");
        if (submitButton) submitButton.disabled = true;
        var event = selectedEvent();
        try {
          var payload = await apiRequest("/api/interests", {
            method: "POST",
            headers: { "content-type": "application/json", "accept": "application/json" },
            body: JSON.stringify({
              eventId: event.id,
              firstName: firstName,
              lastName: lastName,
              email: email,
              gender: gender,
              age: age,
              nationality: nationality,
              activity: activity,
              description: description,
              passions: passions,
              adult: adult,
              publicConsent: publicConsent,
              contactConsent: contactConsent,
              website: website
            })
          });
          applyLiveEvent(event, payload);
          if (payload.member && payload.withdrawToken) rememberWithdrawal(event, payload.member.id, payload.withdrawToken);
          state.personalProfile = normalisePersonalProfile({
            firstName: firstName,
            lastName: lastName,
            age: age,
            gender: gender
          });
          state.profileDraft = Object.assign({}, state.personalProfile);
          persistPersonalProfile();
          state.joinStatus = "";
          state.history = [];
          state.screen = "contact";
          render();
        } catch (error) {
          state.joinStatus = "";
          setJoinFeedback(error && error.message ? error.message : i18n("Impossible d’ajouter ton intérêt pour le moment.", "We could not add your interest right now."));
          if (submitButton) submitButton.disabled = false;
        }
      }

      async function withdrawLiveInterest() {
        var event = selectedEvent();
        var remembered = rememberedWithdrawal(event);
        var feedback = app.querySelector("#withdraw-feedback");
        if (!remembered || !remembered.token) {
          if (feedback) feedback.textContent = i18n("Cette session ne peut plus retirer ce profil. Contacte l’équipe si besoin.", "This session can no longer remove this profile. Contact the team if needed.");
          return;
        }
        if (feedback) feedback.textContent = i18n("Retrait de ton intérêt…", "Removing your interest…");
        try {
          var payload = await apiRequest("/api/interests/withdraw", {
            method: "POST",
            headers: { "content-type": "application/json", "accept": "application/json" },
            body: JSON.stringify({ eventId: event.id, token: remembered.token })
          });
          applyLiveEvent(event, payload);
          clearRememberedWithdrawal(event);
          state.history = [];
          state.screen = "event";
          render();
          loadLiveEvent(event);
        } catch (error) {
          if (feedback) feedback.textContent = error && error.message ? error.message : i18n("Impossible de retirer ton intérêt pour le moment.", "We could not remove your interest right now.");
        }
      }

      function reservePlace() {
        var card = app.querySelector("#card-number");
        var consent = app.querySelector("#payment-consent");
        var feedback = app.querySelector("#reservation-feedback");
        var digits = card ? card.value.replace(/\D/g, "") : "";
        if (digits.length !== 16 || !consent || !consent.checked) {
          if (feedback) feedback.textContent = "Renseigne les 16 chiffres fictifs et ton accord pour réserver.";
          return;
        }
        var event = selectedEvent();
        if (!hasJoinedEvent(state.eventIndex)) {
          createReservation(state.eventIndex);
          event.current += 1;
        }
        state.history = [];
        state.screen = "group";
        render();
      }

      function nextResponder(reservation) {
        var responders = ["Maya", "Jonas", "Sofia"];
        var group = reservation || activeReservation() || newReservation();
        var ownMessageCount = group.messages.filter(function (message) { return message.mine; }).length;
        return responders[Math.max(0, ownMessageCount - 1) % responders.length];
      }

      function normalizeForReply(value) {
        return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      function messageExcerpt(value) {
        var excerpt = String(value || "").replace(/\s+/g, " ").trim();
        return excerpt.length > 54 ? excerpt.slice(0, 51) + "…" : excerpt;
      }

      function contextualReply(message, event) {
        var text = normalizeForReply(message);
        var currentEvent = event || groupEvent();
        var venue = eventVenue(currentEvent);
        var date = eventDate(currentEvent);
        var english = state.locale === "en";
        if (/(restaurant|resto|brunch|cafe|bar|manger|diner|dejeuner)/.test(text)) {
          return english ? "Great idea — I’m up for meeting near " + venue + " before " + currentEvent.title + "." : "Très bonne idée — je suis partant·e pour se retrouver près de " + venue + " avant " + currentEvent.title + ".";
        }
        if (/(heure|horaire|quand|rendez[ -]?vous|rdv|arriv)/.test(text)) {
          return english ? "That works for me. Shall we meet 30 minutes before at " + venue + "?" : "Ça me va. On se retrouve 30 min avant à " + venue + " ?";
        }
        if (/(metro|transport|train|bus|voiture|covoiturage|trajet)/.test(text)) {
          return english ? "I’ll check the route to " + venue + ". We can meet at the entrance and go in together." : "Je regarde aussi l’itinéraire vers " + venue + ". On peut se retrouver à l’entrée et y aller ensemble.";
        }
        if (/(billet|payer|paiement|prix|reservation|reserver)/.test(text)) {
          return english ? "For tickets, nothing is charged today; confirmation happens at D-7. We can sort the details out here." : "Côté billet, rien n’est débité aujourd’hui ; la confirmation se fait à J-7. On peut régler les détails ici.";
        }
        if (/(salut|bonjour|hello|coucou)/.test(text)) {
          return english ? "Hi! Welcome to the group for " + currentEvent.title + ". Looking forward to planning it together." : "Salut ! Bienvenue dans le groupe pour " + currentEvent.title + ". Hâte de préparer ça ensemble.";
        }
        if (/\?$/.test(String(message || "").trim())) {
          return english ? "Good question. Let’s decide together in the chat before " + date + "." : "Bonne question. On peut en décider ensemble ici avant " + date + ".";
        }
        return english ? "I like that idea: “" + messageExcerpt(message) + "”. We can organise it together before " + date + "." : "J’aime bien cette idée : « " + messageExcerpt(message) + " ». On peut s’organiser ensemble avant " + date + ".";
      }

      function sendMessage() {
        var input = app.querySelector("#chat-input");
        if (!input || !input.value.trim()) return;
        var reservation = activeReservation();
        if (!reservation) return;
        var message = input.value.trim();
        reservation.messages.push({ author: userFirstName() || i18n("Moi", "Me"), text: message, mine: true });
        reservation.messages.push({ author: nextResponder(reservation), text: contextualReply(message, groupEvent()), mine: false });
        render();
      }

      function showLeaveRule() {
        var reservation = activeReservation();
        if (!reservation) return;
        if (!reservation.paid) {
          reservation.leaveMessage = "Tu peux quitter librement avant le paiement : aucun débit n'a été effectué.";
        } else if (reservation.day === "J-14") {
          reservation.leaveMessage = "Avant J-7, le billet est remboursé hors frais de service.";
        } else {
          reservation.leaveMessage = "Après la confirmation à J-7, le billet est non remboursable sauf si une personne reprend ta place.";
        }
        render();
      }

      render();
      loadLiveCounts();
      window.addEventListener("focus", function () {
        loadLiveCounts();
        if (state.screen === "event" || state.screen === "people" || state.screen === "member-profile") {
          loadLiveEvent(selectedEvent());
        }
      });
    }());
  </script>
</body>
</html>
