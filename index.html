<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Never Go Alone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

    :root {
      --ink: #292530;
      --muted: #706775;
      --paper: #fffaf6;
      --card: #ffffff;
      --line: #e8dfd9;
      --brand: #554abb;
      --brand-soft: #eeebff;
      --coral: #e66d56;
      --green: #247852;
      --green-soft: #dff3e7;
      --gold: #c98d21;
      --shadow: 0 18px 48px rgba(52, 37, 30, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      background: #f2ece7;
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid #f2a64a;
      outline-offset: 3px;
    }

    .stage {
      min-height: 100vh;
      min-height: 100svh;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px minmax(0, 1fr);
      align-items: center;
      gap: 48px;
      padding: 24px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #e8e0ff, #f2ece7 56%);
    }

    .intro { max-width: 290px; justify-self: end; }
    .intro small { color: var(--brand); font-weight: 800; letter-spacing: .12em; }
    .intro h1 {
      margin: 10px 0;
      font: 700 48px/.93 "Fraunces", Georgia, serif;
      letter-spacing: -.08em;
    }
    .intro em { color: var(--brand); font-style: normal; }
    .intro p, .side { color: var(--muted); line-height: 1.55; }
    .side { max-width: 190px; }

    .phone {
      position: relative;
      width: 420px;
      height: 874px;
      padding: 5px;
      border: 10px solid #181820;
      border-radius: 54px;
      background: #181820;
      box-shadow: var(--shadow);
      transform: scale(var(--phone-scale, 1));
      transform-origin: center;
    }

    .notch {
      position: absolute;
      z-index: 5;
      top: 5px;
      left: calc(50% - 63px);
      width: 126px;
      height: 28px;
      border-radius: 0 0 18px 18px;
      background: #181820;
    }

    #app {
      height: 100%;
      overflow: hidden;
      border-radius: 39px;
      background: var(--paper);
    }

    .view {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .screen-header {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      min-height: 76px;
      padding: 32px 16px 8px;
    }

    .screen-header strong { text-align: center; font-size: 13px; }
    .header-spacer { width: 36px; height: 36px; }
    .home-header { grid-template-columns: 86px 1fr 40px; }
    .home-button {
      min-height: 36px;
      padding: 0 9px;
      border: 0;
      border-radius: 18px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
    }
    .icon-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 22px;
      line-height: 1;
    }

    .explore-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 39px 20px 10px;
    }

    .eyebrow {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: 8px;
      font: 700 25px/1.04 "Fraunces", Georgia, serif;
      letter-spacing: -.045em;
    }
    h2 { margin-bottom: 7px; font-size: 16px; }
    h3 { margin-bottom: 5px; font-size: 15px; }
    .muted { color: var(--muted); line-height: 1.45; }
    .tiny { font-size: 11px; }

    .location-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px 12px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #f0eae5;
      color: #514a57;
      font-size: 12px;
      font-weight: 600;
    }

    .location-bar button {
      margin-left: auto;
      padding: 2px 0;
      border: 0;
      background: none;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }

    .scroll {
      flex: 1;
      overflow: auto;
      padding: 0 20px 88px;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .scroll::-webkit-scrollbar { display: none; }

    .filters {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin: 0 -20px 14px;
      padding: 0 20px;
      scrollbar-width: none;
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: var(--card);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .chip.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .age-preference {
      margin: 15px 0;
      padding: 13px;
      border: 1px solid #dcd5ee;
      border-radius: 14px;
      background: var(--brand-soft);
    }
    .age-preference b { display: block; font-size: 12px; }
    .age-preference p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .age-preference .filters { margin: 10px -13px 0; padding: 0 13px; }

    .event-list { display: grid; gap: 12px; }

    .event-card {
      width: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 18px;
      background: var(--card);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 4px 14px rgba(56, 41, 26, .08);
    }

    .event-poster {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      min-height: 110px;
      padding: 13px;
      overflow: hidden;
      color: #fff;
      isolation: isolate;
    }

    .event-poster::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(110deg, rgba(20, 16, 34, .76), rgba(20, 16, 34, .1) 60%, rgba(12, 9, 19, .58));
      content: "";
    }
    .event-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .event-artwork.contain { padding: 15px; object-fit: contain; background: radial-gradient(circle, rgba(255, 255, 255, .22), rgba(13, 25, 47, .9)); }
    .matchup-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 22px;
      background: radial-gradient(circle at center, #427e9d, #172b4b 68%);
    }
    .matchup-artwork img { width: min(33%, 92px); max-height: 76px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); }
    .matchup-artwork span { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
    .event-poster small,
    .event-poster b {
      position: relative;
      z-index: 2;
    }
    .event-poster b {
      max-width: 230px;
      font: 700 25px/.95 "Fraunces", Georgia, serif;
      letter-spacing: -.06em;
      text-align: right;
    }

    .event-poster {
      background-position: center;
      background-size: cover;
    }
    .concert {
      background-image: linear-gradient(110deg, rgba(28, 22, 62, .78), rgba(108, 39, 73, .18), rgba(15, 11, 30, .58)), url("assets/concert-live.png");
    }
    .sport {
      background-image: linear-gradient(110deg, rgba(12, 53, 71, .8), rgba(22, 100, 105, .13), rgba(9, 25, 44, .53)), url("assets/sport-run.png");
    }
    .football {
      background-image: linear-gradient(110deg, rgba(8, 21, 55, .82), rgba(88, 15, 31, .14), rgba(4, 10, 28, .58)), url("assets/football-derby.png");
    }
    .theatre {
      background-image: linear-gradient(110deg, rgba(47, 13, 25, .79), rgba(104, 33, 33, .13), rgba(19, 9, 13, .56)), url("assets/theatre-stage.png");
    }
    .club {
      background-image: linear-gradient(110deg, rgba(16, 12, 47, .81), rgba(72, 28, 113, .12), rgba(24, 12, 45, .57)), url("assets/club-night.png");
    }
    .festival {
      background-image: linear-gradient(110deg, rgba(83, 37, 15, .73), rgba(134, 57, 18, .1), rgba(53, 21, 8, .53)), url("assets/festival-outdoor.png");
    }
    .humour {
      background-image: linear-gradient(110deg, rgba(48, 26, 12, .79), rgba(99, 43, 15, .1), rgba(29, 15, 8, .55)), url("assets/comedy-night.png");
    }

    .event-copy { padding: 12px 13px 13px; }
    .event-copy p { margin-bottom: 8px; color: var(--muted); font-size: 11px; }
    .price-line { display: flex; align-items: baseline; gap: 7px; }
    .price-line b { color: var(--brand); }
    .price-line s { color: var(--muted); font-size: 11px; }
    .progress {
      height: 7px;
      margin: 10px 0 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #f3e3dd;
    }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--coral); }
    .event-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; }
    .member-dots { color: var(--brand); letter-spacing: -2px; }
    .live-note { margin: -3px 0 14px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .source-link { display: inline-flex; margin: -2px 0 5px; color: var(--brand); font-size: 11px; font-weight: 800; text-decoration: none; }
    .source-link:hover { text-decoration: underline; }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 66px;
      padding: 7px 9px;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .bottom-nav button {
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .bottom-nav button.active { color: var(--brand); background: var(--brand-soft); }

    .hero-poster { margin: 0 0 17px; border-radius: 18px; }
    .info-card, .notice-card, .profile-card, .private-lock {
      margin: 14px 0;
      padding: 13px;
      border-radius: 14px;
      background: #f1ebe6;
    }
    .info-card p, .notice-card p, .profile-card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .private-lock { border: 1px solid #ddd3ff; background: var(--brand-soft); color: #39306f; }
    .private-lock p { margin: 4px 0 0; font-size: 12px; line-height: 1.4; }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
    }
    .primary.coral { background: var(--coral); }
    .primary.gold { background: linear-gradient(135deg, #b47814, #f2cf6b); color: #3a2500; }
    .primary.ghost { border: 1px solid var(--brand); background: transparent; color: var(--brand); }
    .fixed-action { position: absolute; right: 20px; bottom: 16px; left: 20px; }

    .member-list { display: grid; }
    .member-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 11px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .member-row > span:nth-child(2) { min-width: 0; flex: 1; }
    .member-row b { display: block; font-size: 13px; }
    .member-row p { margin: 3px 0 0; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .profile-arrow { color: var(--brand); font-size: 18px; }

    .avatar {
      position: relative;
      display: inline-grid;
      flex: 0 0 auto;
      width: 43px;
      height: 43px;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      isolation: isolate;
    }
    .avatar::after {
      position: absolute;
      z-index: -1;
      inset: 10px 10px -6px;
      border-radius: 50% 50% 36% 36%;
      background: rgba(255, 255, 255, .25);
      content: "";
    }
    .avatar-0, .photo-0 { background: linear-gradient(145deg, #e3b58e 0 38%, #365c60 39%); }
    .avatar-1, .photo-1 { background: linear-gradient(145deg, #d59d76 0 38%, #41527e 39%); }
    .avatar-2, .photo-2 { background: linear-gradient(145deg, #c98263 0 38%, #7e3e5c 39%); }
    .avatar-3, .photo-3 { background: linear-gradient(145deg, #ca956e 0 38%, #4a775f 39%); }
    .avatar-4, .photo-4 { background: linear-gradient(145deg, #b77a57 0 38%, #614d88 39%); }
    .avatar-5, .photo-5 { background: linear-gradient(145deg, #8f633f 0 38%, #315f78 39%); }
    .avatar-6, .photo-6 { background: linear-gradient(145deg, #d4a16c 0 38%, #315a51 39%); }
    .avatar-7, .photo-7 { background: linear-gradient(145deg, #9a5c42 0 38%, #76426c 39%); }
    .avatar-8, .photo-8 { background: linear-gradient(145deg, #bc8058 0 38%, #3d597b 39%); }
    .avatar-9, .photo-9 { background: linear-gradient(145deg, #d6ac7e 0 38%, #6e5734 39%); }
    .avatar-10, .photo-10 { background: linear-gradient(145deg, #875d48 0 38%, #3a6b70 39%); }
    .avatar-11, .photo-11 { background: linear-gradient(145deg, #c78d69 0 38%, #52447a 39%); }

    .profile-hero { text-align: center; }
    .profile-hero .avatar { width: 78px; height: 78px; font-size: 27px; }
    .verified { margin: 6px 0 0; color: var(--green); font-size: 12px; font-weight: 800; }
    .photo-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 88px 88px;
      gap: 7px;
      margin: 17px 0;
    }
    .profile-photo {
      position: relative;
      display: grid;
      place-items: end start;
      overflow: hidden;
      border-radius: 14px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }
    .profile-photo:first-child { grid-row: span 2; }
    .profile-photo::after {
      position: absolute;
      right: 18%;
      bottom: -24px;
      width: 58%;
      height: 76%;
      border-radius: 50% 50% 18px 18px;
      background: rgba(255, 255, 255, .22);
      content: "";
    }
    .profile-photo span { z-index: 1; padding: 9px; text-shadow: 0 1px 4px rgba(0, 0, 0, .35); }

    .field { display: grid; gap: 6px; margin: 14px 0; }
    .field label { font-size: 11px; font-weight: 800; }
    .field input, .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid #dcd1cb;
      border-radius: 11px;
      background: var(--card);
      color: var(--ink);
    }
    .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .check input { margin-top: 2px; }
    .feedback { min-height: 18px; margin: 6px 0; color: #a03934; font-size: 11px; font-weight: 700; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 8px 20px 11px;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      border: 0;
      border-radius: 9px;
      padding: 9px 5px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .tabs button.active { background: var(--brand-soft); color: var(--brand); }

    .message {
      max-width: 84%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 13px 13px 13px 3px;
      background: #f0ebe6;
      font-size: 11px;
      line-height: 1.35;
    }
    .message.mine {
      margin-left: auto;
      border-radius: 13px 13px 3px 13px;
      background: var(--brand);
      color: #fff;
    }
    .chat-author { display: block; margin-bottom: 3px; font-size: 9px; font-weight: 800; opacity: .76; }
    .chat-composer { display: flex; gap: 7px; margin-top: 12px; }
    .chat-composer input { min-width: 0; flex: 1; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); }
    .chat-composer button { width: 44px; border: 0; border-radius: 11px; background: var(--brand); color: #fff; font-size: 18px; }

    .restaurant {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 9px;
      margin: 7px 0;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: var(--card);
      color: var(--ink);
      text-align: left;
    }
    .restaurant span:first-child { flex: 1; font-size: 12px; font-weight: 700; }
    .restaurant span:last-child { color: var(--brand); font-size: 10px; font-weight: 800; }

    .timeline { display: grid; gap: 0; margin: 14px 0; }
    .timeline-step { position: relative; padding: 0 0 17px 28px; color: var(--muted); font-size: 12px; }
    .timeline-step::before { position: absolute; top: 0; left: 0; width: 14px; height: 14px; border: 3px solid var(--line); border-radius: 50%; background: var(--paper); content: ""; }
    .timeline-step::after { position: absolute; top: 15px; bottom: 0; left: 6px; width: 2px; background: var(--line); content: ""; }
    .timeline-step:last-child::after { display: none; }
    .timeline-step.done { color: var(--green); font-weight: 700; }
    .timeline-step.done::before { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 3px var(--paper); }
    .status { margin: 12px 0; padding: 12px; border-radius: 12px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 700; }
    .status.neutral { background: var(--brand-soft); color: #39306f; }
    .qr {
      display: grid;
      width: 160px;
      aspect-ratio: 1;
      place-items: center;
      margin: 18px auto 6px;
      border: 12px solid #fff;
      background: repeating-conic-gradient(#25212d 0 25%, #fff 0 50%) 50% / 22px 22px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      text-shadow: 0 1px 3px #000;
    }

    .city-row {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 8px 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
      color: var(--ink);
      text-align: left;
    }
    .city-row b { flex: 1; }
    .city-row span { color: var(--brand); font-size: 11px; font-weight: 800; }

    .empty { padding: 100px 7px 0; text-align: center; }
    .empty p { color: var(--muted); line-height: 1.45; }

    .google-form {
      display: block;
      width: 100%;
      min-height: 570px;
      margin: 14px 0 0;
      border: 0;
      border-radius: 12px;
      background: #fff;
    }
    .form-note { padding: 12px; border-radius: 12px; background: #fff3d6; color: #5c4105; font-size: 11px; line-height: 1.45; }

    .live-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 13px 0;
      padding: 11px 12px;
      border: 1px solid #cfe8db;
      border-radius: 13px;
      background: #effaf4;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.35;
    }
    .live-banner::before { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px rgba(36, 120, 82, .12); content: ""; }
    .live-count { color: var(--green); font-size: 11px; font-weight: 800; }
    .live-empty { margin: 18px 0; padding: 18px 13px; border: 1px dashed #d8cec7; border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.45; text-align: center; }
    .live-member-copy { color: var(--muted); font-size: 10px; line-height: 1.35; }
    .live-member-copy b { color: var(--ink); }
    .live-form { padding-bottom: 26px; }
    .live-form h1 { margin-top: 2px; }
    .live-form .check { margin: 12px 0; }
    .live-form .check strong { color: var(--ink); }
    .live-form .tiny { display: block; color: var(--muted); line-height: 1.45; }
    .live-form-actions { display: grid; gap: 9px; margin-top: 15px; }
    .honeypot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .success-card { margin: 12px 0 16px; padding: 14px; border-radius: 14px; background: var(--green-soft); color: var(--green); }
    .success-card b { display: block; margin-bottom: 4px; }
    .success-card p { margin: 0; font-size: 12px; line-height: 1.4; }
    .withdraw-button { margin-top: 10px; color: #9c3f36 !important; border-color: #c9766c !important; }

    .language-picker {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 7px;
      margin: 14px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
    }
    .language-picker > span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .language-picker button {
      min-width: 65px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 9px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .language-picker button.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    body.dark {
      --ink: #f6f0f5;
      --muted: #cbbfca;
      --paper: #211e27;
      --card: #2c2732;
      --line: #4d4452;
      --brand-soft: #3a345e;
      --green-soft: #1c4738;
      background: #17151b;
    }
    body.dark .stage { background: radial-gradient(circle at 50% 35%, #332a4d, #17151b 56%); }
    body.dark .info-card,
    body.dark .notice-card,
    body.dark .profile-card,
    body.dark .message:not(.mine) { background: #342d37; }
    body.dark .location-bar {
      border-color: #5d5066;
      background: #342d37;
      color: #ffffff;
    }
    body.dark .location-bar button { color: #ffffff; }
    body.dark .city-row,
    body.dark .restaurant {
      border-color: #5d5066;
      background: #342d37;
      color: #ffffff;
    }
    body.dark .city-row b,
    body.dark .restaurant span:first-child { color: #ffffff; }
    body.dark .city-row span,
    body.dark .restaurant span:last-child { color: #e2d9ff; }
    body.dark .source-link { color: #cfc9ff; }
    body.dark .field input,
    body.dark .field select,
    body.dark .chat-composer input { border-color: #5d5066; }
    body.dark .bottom-nav { background: color-mix(in srgb, var(--paper) 94%, transparent); }
    body.dark .private-lock { background: #37315a; border-color: #665b9f; color: #f3efff; }
    body.dark .form-note { background: #4e3910; color: #ffe6a8; }
    body.dark .live-banner { border-color: #396c57; background: #193b30; color: #b9efd1; }
    body.dark .live-empty { border-color: #63596b; }

    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; padding: 0; justify-items: center; }
      .intro, .side { display: none; }
    }
    @media (max-width: 600px) {
      html, body { height: 100%; overflow: hidden; }
      .stage {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100svh;
        padding: 0;
      }
      .phone {
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        transform: none;
      }
      #app { border-radius: 0; }
      .notch { display: none; }
    }
  </style>

      function translateText(value) {
        if (state.locale !== "en" || !value) return value;
        var leading = (value.match(/^\s*/) || [""])[0];
        var trailing = (value.match(/\s*$/) || [""])[0];
        var text = value.trim();
        var translated = englishText[text] || text;

        translated = translated
          .replace(/(\d+) sur (\d+) pour le tarif groupe/g, "$1 of $2 for group rate")
          .replace(/^Billet groupe : ([\d,]+) € · Frais de service : ([\d,]+) €$/, "Group ticket: €$1 · Service fee: €$2")
          .replace(/^Économie totale : ([\d,]+) €$/, "Total saving: €$1")
          .replace(/^✓ (.+) · identité vérifiée$/, function (_, job) {
            return "✓ " + (englishText[job] || job) + " · verified identity";
          })
          .replace(/^Originaire de (.+) · à Paris depuis (.+)$/, function (_, origin, duration) {
            return "Originally from " + origin + " · in Paris for " + duration.replace(/(\d+) mois/g, "$1 months").replace(/1 an/g, "1 year").replace(/(\d+) ans/g, "$1 years");
          })
          .replace(/^Voir le profil de (.+)$/, "View profile of $1")
          .replace(/^Trois photos de (.+)$/, "Three photos of $1")
          .replace(/^Photo de (.+) à un événement$/, "Photo of $1 at an event")
          .replace(/^Photo de (.+) en ville$/, "Photo of $1 in the city")
          .replace(/^Photo de (.+) avec des amis$/, "Photo of $1 with friends")
          .replace(/^Choisis un endroit près de (.+) pour discuter avant l'événement.$/, "Choose a place near $1 to chat before the event.")
          .replace(/^Vous êtes (\d+) personnes intéressées\. Appuie sur un membre pour voir son profil.$/, "There are $1 interested people. Tap a member to see their profile.")
          .replace(/^On maintient la sortie à (\d+)$/, "We'll go as a group of $1")
          .replace(/^Confirmer et payer (.+)$/, "Confirm and pay $1")
          .replace(/^Je propose (.+) avant la sortie 🍴$/, "I suggest $1 before the event 🍴")
          .replace(/^(\d+) ans$/g, "$1 years")
          .replace(/^(\d+) mois$/g, "$1 months")
          .replace(/^1 an$/g, "1 year")
          .replace(/(\d+) ans\b/g, "$1 years")
          .replace(/^J-(\d+)$/, "D-$1");

        return leading + translated + trailing;
      }

      function localizeElement(root) {
        if (state.locale !== "en") return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var textNodes = [];
        var node;
        while ((node = walker.nextNode())) textNodes.push(node);
        textNodes.forEach(function (textNode) {
          textNode.nodeValue = translateText(textNode.nodeValue);
        });
        root.querySelectorAll("[aria-label], [placeholder], [title]").forEach(function (element) {
          ["aria-label", "placeholder", "title"].forEach(function (attribute) {
            if (element.hasAttribute(attribute)) {
              element.setAttribute(attribute, translateText(element.getAttribute(attribute)));
            }
          });
        });
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
        });

      function stableEventId(event) {
        return ["nga", event.city, event.date, event.title].join("-").normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")

          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

      function liveCount(event) {
        var value = Number(event && event.liveCount);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function liveMembers(event) {
        return event && Array.isArray(event.liveMembers) ? event.liveMembers : [];

      async function apiRequest(path, options) {
        var settings = options || {};
        var headers = Object.assign({ "accept": "application/json" }, settings.headers || {});
        var response = await fetch(path, Object.assign({}, settings, { headers: headers, credentials: "same-origin" }));
        var body = null;
        try { body = await response.json(); } catch (error) { body = null; }
        if (!response.ok) throw new Error((body && body.error) || i18n("Le service live est indisponible. Réessaie dans un instant.", "The live service is unavailable. Please try again shortly."));
        return body || {};
      }

      function applyLiveEvent(event, payload) {
        if (!event || !payload) return;
        event.liveCount = Math.max(0, Number(payload.count) || 0);
        if (Array.isArray(payload.members)) event.liveMembers = payload.members;
      }

      async function loadLiveCounts() {
        if (live.loadingCounts) return;
        live.loadingCounts = true;
        try {
          var payload = await apiRequest("/api/interest-counts");
          var counts = payload.counts || {};
          events.forEach(function (event) {
            event.liveCount = Math.max(0, Number(counts[event.id]) || 0);
          });
          live.countsLoaded = true;
          live.error = "";
        } catch (error) {
          live.error = error && error.message ? error.message : "";
        } finally {
          live.loadingCounts = false;
          liveRefreshView();
        }
      }

      async function loadLiveEvent(event) {
        if (!event || live.loadingEvent[event.id]) return;
        live.loadingEvent[event.id] = true;
        try {
          var payload = await apiRequest("/api/events/" + encodeURIComponent(event.id) + "/interests");
          applyLiveEvent(event, payload);
          live.countsLoaded = true;
          live.error = "";
        } catch (error) {
          live.error = error && error.message ? error.message : "";
        } finally {
          delete live.loadingEvent[event.id];
          liveRefreshView();
        }

      function rememberWithdrawal(event, memberId, token) {
        try {
          sessionStorage.setItem(withdrawalStorageKey(event), JSON.stringify({ memberId: memberId, token: token }));

      function rememberedWithdrawal(event) {
        try {
          var raw = sessionStorage.getItem(withdrawalStorageKey(event));
          return raw ? JSON.parse(raw) : null;
        } catch (error) { return null; }

      function clearRememberedWithdrawal(event) {
        try { sessionStorage.removeItem(withdrawalStorageKey(event)); } catch (error) { /* no-op */ }

      function peopleMatchingAgePreference(list) {
        var ranges = {
          "18-23": [18, 23],
          "24-26": [24, 26],
          "27-30": [27, 30]
        };
        var range = ranges[state.agePreference];
        var profiles = (list || profilesForEvent(selectedEvent())).slice();
        if (!range) return profiles;
        return profiles.map(function (person, index) {
          return { person: person, index: index, matches: person.age >= range[0] && person.age <= range[1] };
        }).sort(function (first, second) {
          return Number(second.matches) - Number(first.matches) || first.index - second.index;

      }

      function homeHeader(title) {
        return "<header class='screen-header home-header'>" +
          "<button type='button' class='home-button' data-action='home' aria-label='Retourner à l’accueil'>⌂ Accueil</button>" +
          "<strong>" + esc(title) + "</strong><span class='header-spacer'></span></header>";
      }

      function rootHeader() {
        return "<header class='explore-head'><div><span class='eyebrow'>" + esc(state.city.toUpperCase()) +
          "</span><h1>Explorer</h1></div><button type='button' class='icon-button' data-action='profile' aria-label='Ouvrir mon profil'>A</button></header>";
      }

      function bottomNav(active) {
        var items = [
          ["explore", "⌂ Explorer"],
          ["profile", "◉ Profil"]
        ];
        return "<nav class='bottom-nav' aria-label='Navigation principale'>" + items.map(function (item) {
          return "<button type='button' data-action='nav' data-screen='" + item[0] + "' class='" +
            (active === item[0] ? "active" : "") + "'>" + item[1] + "</button>";
        }).join("") + "</nav>";
      }

      function poster(event, extraClass) {
        var posterAlt = state.locale === "en" ? "Poster for " + event.title : "Affiche de " + event.title;
        var imageLoading = extraClass ? "eager" : "lazy";
        var artwork = event.secondaryImageUrl ? "<div class='matchup-artwork' aria-hidden='true'><img src='" + esc(event.imageUrl) + "' alt='' loading='" + imageLoading + "' decoding='async' referrerpolicy='no-referrer'><span>VS</span><img src='" + esc(event.secondaryImageUrl) + "' alt='' loading='" + imageLoading + "' decoding='async' referrerpolicy='no-referrer'></div>" :
          event.imageUrl ? "<img class='event-artwork " + (event.imageFit === "contain" ? "contain" : "") + "' src='" + esc(event.imageUrl) + "' alt='" + esc(posterAlt) + "' loading='" + imageLoading + "' decoding='async' referrerpolicy='no-referrer' onerror='this.hidden=true'>" : "";
        return "<div class='event-poster " + esc(event.theme) + " " + (extraClass || "") + "'>" +
          artwork + "<small>" + esc(event.category) + "</small><b>" + esc(event.poster) + "</b></div>";
      }

      function eventCard(event, index) {
        var count = liveCount(event);
        var percentage = Math.min(100, Math.round((count / event.minimum) * 100));
        var countLabel = count ? i18n(count + " intérêt" + (count > 1 ? "s" : "") + " en direct", count + " live interest" + (count > 1 ? "s" : "")) : i18n("Premier intérêt attendu", "Be the first to join");
        var groupLabel = i18n(count + " sur " + event.minimum + " pour le tarif groupe", count + " of " + event.minimum + " for the group price");
        var dots = count ? "● ".repeat(Math.min(3, count)).trim() : "○ ○ ○";
        return "<button type='button' class='event-card' data-action='open-event' data-event-id='" + index + "'>" +
          poster(event) +
          "<div class='event-copy'><h3>" + esc(event.title) + "</h3>" +
          "<p>" + esc(eventDate(event)) + " · " + esc(eventVenue(event)) + "</p>" +
          "<div class='price-line'><b>" + event.groupPrice + " €</b><s>" + event.publicPrice + " €</s>" +
          "<span class='tiny'>−" + Math.round((1 - event.groupPrice / event.publicPrice) * 100) + " %</span></div>" +
          "<div class='progress'><span style='width:" + percentage + "%'></span></div>" +
          "<div class='event-meta'><span>" + esc(groupLabel) + "</span>" +
          "<span class='member-dots' aria-label='" + esc(countLabel) + "'>" + dots + "</span></div>" +
          "<p class='live-count'>" + esc(countLabel) + "</p></div></button>";
      }

      function explore() {
        var cityEvents = eventsForCity(state.city);
        var categories = ["Tout"];
        cityEvents.forEach(function (event) {
          if (categories.indexOf(event.category) < 0) categories.push(event.category);
        });
        var listed = cityEvents.filter(function (event) { return state.filter === "Tout" || event.category === state.filter; });
        return "<section class='view'>" + rootHeader() +
          "<div class='location-bar'>⌖ <span>" + esc(state.city) + "</span>" +
          "<button type='button' data-action='city'>Changer ›</button></div>" +
          "<div class='scroll'><p class='live-note'>" + esc(upcomingEventsNote(cityEvents.length)) + "</p><div class='filters'>" + categories.map(function (category) {
            return "<button type='button' class='chip " + (category === state.filter ? "active" : "") +
              "' data-action='filter' data-filter='" + esc(category) + "'>" + esc(category) + "</button>";
          }).join("") + "</div><div class='event-list'>" +
          (listed.length ? listed.map(function (event) { return eventCard(event, events.indexOf(event)); }).join("") : "<div class='empty'><p>Aucune sortie dans ce filtre pour le moment.</p></div>") +
          "</div></div>" + bottomNav("explore") + "</section>";
      }

      function eventDetail() {
        var event = selectedEvent();
        var saving = event.publicPrice - event.groupPrice;
        var count = liveCount(event);
        var liveLabel = count ? i18n(count + " personne" + (count > 1 ? "s ont" : " a") + " déjà signalé son intérêt.", count + " person" + (count > 1 ? "s have" : " has") + " already registered interest.") : i18n("Le groupe live est prêt à accueillir sa première personne.", "The live group is ready for its first person.");
        var peopleLabel = count ? i18n("Voir les " + count + " profil" + (count > 1 ? "s" : "") + " intéressé" + (count > 1 ? "s" : ""), "See " + count + " interested profile" + (count > 1 ? "s" : "")) : i18n("Voir les profils intéressés", "See interested profiles");
        return "<section class='view'>" + header("La sortie") +
          "<div class='scroll'>" + poster(event, "hero-poster") +
          "<h1>" + esc(event.title) + "</h1><p class='muted'>⌖ " + esc(eventVenue()) +
          "<br>" + esc(eventDate(event)) + "<br>Rendez-vous 30 min avant le début.</p>" + officialSourceLink(event) +
          "<div class='live-banner'>" + esc(liveLabel) + "</div>" +
          "<div class='info-card'><b>Une sortie à partager</b><p>Découvre les profils intéressés, puis laisse tes coordonnées pour faire grandir ce groupe live.</p></div>" +
          "<div class='info-card'><b>Prix transparent</b><p>Billet groupe : " + event.groupPrice +
          " € · Frais de service : 2,50 €<br>Économie totale : " + saving + " €</p><p class='tiny'>Tarifs affichés à titre indicatif pour le lancement.</p></div>" +
          "<button type='button' class='primary ghost' data-action='people'>" + esc(peopleLabel) + "</button>" +
          "</div><div class='fixed-action'><button type='button' class='primary coral' data-action='join'>Rejoindre le groupe</button></div></section>";
      }

      function peoplePreview() {
        var event = selectedEvent();
        var profiles = profilesForEvent(event);
        var count = liveCount(event);
        var heading = i18n(count + " profil" + (count > 1 ? "s" : "") + " intéressé" + (count > 1 ? "s" : ""), count + " interested profile" + (count > 1 ? "s" : ""));
        var detail = i18n("Liste mise à jour en direct pour « " + event.title + " ».", "Live list for “" + event.title + ".");
        var status = live.loadingEvent[event.id] ? i18n("Mise à jour des profils…", "Updating profiles…") : i18n("Mise à jour en direct", "Live updates");
        return "<section class='view'>" + header("Personnes intéressées") +
          "<div class='scroll'><h1>" + esc(heading) + "</h1><p class='muted'>" + esc(event.title) + " · " + esc(detail) + "</p>" +
          "<div class='live-banner'>" + esc(status) + "</div>" + memberList(profiles) + "</div></section>";
      }

      function memberList(list) {
        var listedPeople = list || profilesForEvent(selectedEvent());
        if (!listedPeople.length) {
          return "<div class='live-empty'><b>" + esc(i18n("Le groupe commence ici.", "The group starts here.")) + "</b><br>" +
            esc(i18n("Sois la première personne à signaler ton intérêt : ton prénom, ton activité et un avatar seront ajoutés à cette liste.", "Be the first to register interest: your first name, activity and avatar will be added to this list.")) + "</div>";
        }
        return "<div class='member-list'>" + listedPeople.map(function (person) {
          var name = person.firstName || person.name || "Profil";
          var activity = person.activity || person.job || "";
          var id = person.id || "";
          return "<button type='button' class='member-row' data-action='open-member' data-member-id='" + esc(id) +
            "' aria-label='" + esc(i18n("Voir le profil de ", "View profile of ") + name) + "'>" + avatar(person, person.avatarKey) +
            "<span class='live-member-copy'><b>" + esc(name) + "</b><p>" + esc(activity) + " · " + esc(i18n("profil renseigné", "profile provided")) +
            "</p></span><span class='profile-arrow' aria-hidden='true'>›</span></button>";
        }).join("") + "</div>";
      }

      function memberProfile() {
        var person = liveMembers(selectedEvent()).filter(function (member) { return member.id === state.liveMemberId; })[0];
        if (!person) return peoplePreview();
        var name = person.firstName || "Profil";
        return "<section class='view'>" + header("Profil") +
          "<div class='scroll'><div class='profile-hero'>" + avatar(person, person.avatarKey) +
          "<h1>" + esc(name) + "</h1><p class='verified'>" + esc(i18n("Profil renseigné pour cette sortie", "Profile provided for this event")) + "</p></div>" +
          "<div class='profile-card'><b>" + esc(i18n("Activité indiquée", "Activity provided")) + "</b><p>" + esc(person.activity || "") + "</p></div>" +
          "<div class='private-lock'><b>" + esc(i18n("Un profil respectueux de la vie privée", "A privacy-respecting profile")) + "</b><p>" + esc(i18n("Seuls le prénom, l’activité et un avatar illustré sont visibles. Aucun e-mail, nom complet ou genre n’est affiché.", "Only a first name, stated activity and illustrated avatar are visible. No email, full name or gender is displayed.")) + "</p></div>" +
          "</div></section>";
      }

      function joinPage() {
        return "<section class='view'>" + header("Rejoindre le groupe") + liveJoinForm(selectedEvent()) + "</section>";
      }

      function liveJoinForm(event) {
        var count = liveCount(event);
        var waiting = state.joinStatus === "sending";
        var countNote = count ? i18n(count + " personne" + (count > 1 ? "s sont" : " est") + " déjà intéressée" + (count > 1 ? "s" : "") + ".", count + " person" + (count > 1 ? "s are" : " is") + " already interested.") : i18n("Tu peux lancer ce groupe live.", "You can start this live group.");
        return "<div class='scroll live-form'><h1>" + esc(i18n("Ton profil pour cette sortie", "Your profile for this event")) + "</h1>" +
          "<p class='muted'>" + esc(i18n("Renseigne ton profil : il sera ajouté aux personnes intéressées par « " + event.title + " ».", "Complete your profile: it will be added to the people interested in “" + event.title + ".")) + "</p>" +
          "<div class='live-banner'>" + esc(countNote) + "</div>" +
          "<form id='live-interest-form' novalidate>" +
          "<div class='two-columns'><div class='field'><label for='live-first-name'>" + esc(i18n("Prénom", "First name")) + "</label><input id='live-first-name' name='firstName' maxlength='30' autocomplete='given-name' required></div>" +
          "<div class='field'><label for='live-last-name'>" + esc(i18n("Nom", "Last name")) + "</label><input id='live-last-name' name='lastName' maxlength='50' autocomplete='family-name' required></div></div>" +
          "<div class='field'><label for='live-email'>" + esc(i18n("E-mail", "Email")) + "</label><input id='live-email' name='email' type='email' maxlength='254' autocomplete='email' inputmode='email' required></div>" +
          "<div class='two-columns'><div class='field'><label for='live-gender'>" + esc(i18n("Genre (privé)", "Gender (private)")) + "</label><select id='live-gender' name='gender'><option value='unspecified'>" + esc(i18n("Je préfère ne pas préciser", "Prefer not to say")) + "</option><option value='woman'>" + esc(i18n("Femme", "Woman")) + "</option><option value='man'>" + esc(i18n("Homme", "Man")) + "</option></select></div>" +
          "<div class='field'><label for='live-activity'>" + esc(i18n("Activité", "Activity")) + "</label><input id='live-activity' name='activity' maxlength='80' autocomplete='organization-title' placeholder='" + esc(i18n("Ex. master finance", "E.g. master’s in finance")) + "' required></div></div>" +
          "<p class='tiny'>" + esc(i18n("Le genre ne sert qu’à choisir un style d’avatar illustré et n’est ni affiché ni conservé. Aucune photo réelle n’est demandée.", "Gender is used only to choose an illustrated avatar style and is neither shown nor kept. No real photo is requested.")) + "</p>" +
          "<div class='honeypot' aria-hidden='true'><label for='live-website'>Website</label><input id='live-website' name='website' tabindex='-1' autocomplete='off'></div>" +
          "<label class='check'><input id='live-adult' type='checkbox' required><span>" + esc(i18n("J’ai au moins 18 ans.", "I am at least 18 years old.")) + "</span></label>" +
          "<label class='check'><input id='live-public-consent' type='checkbox' required><span>" + esc(i18n("J’accepte que mon prénom, mon activité et mon avatar illustré soient visibles sur la fiche de cet événement. Mon nom, mon e-mail et mon genre ne seront jamais affichés.", "I agree that my first name, activity and illustrated avatar can appear on this event page. My last name, email and gender will never be displayed.")) + "</span></label>" +
          "<label class='check'><input id='live-contact-consent' type='checkbox' required><span>" + esc(i18n("Je souhaite être recontacté·e au lancement et je compléterai le formulaire de contact à l’étape suivante.", "I would like to be contacted at launch and will complete the contact form in the next step.")) + "</span></label>" +
          "<p id='live-join-feedback' class='feedback' role='status' aria-live='polite'></p>" +
          "<div class='live-form-actions'><button type='submit' class='primary coral'" + (waiting ? " disabled" : "") + ">" + esc(waiting ? i18n("Enregistrement…", "Saving…") : i18n("Ajouter mon profil au groupe", "Add my profile to the group")) + "</button></div>" +
          "</form></div>";
      }

      function contactPage() {
        var event = selectedEvent();
        var count = liveCount(event);
        var countNote = i18n("Le groupe compte maintenant " + count + " personne" + (count > 1 ? "s" : "") + " intéressée" + (count > 1 ? "s" : "") + ".", "The group now has " + count + " interested person" + (count > 1 ? "s" : "") + ".");
        return "<section class='view'>" + homeHeader(i18n("Finaliser", "Finish")) + "<div class='scroll'>" +
          "<h1>" + esc(i18n("Ton intérêt est enregistré", "Your interest is registered")) + "</h1>" +
          "<div class='success-card'><b>✓ " + esc(i18n("Ton profil est visible dans ce groupe live.", "Your profile is now visible in this live group.")) + "</b><p>" + esc(countNote) + "</p></div>" +
          "<div class='form-note'><b>" + esc(i18n("Dernière étape", "Final step")) + "</b><br>" + esc(i18n("Complète ce formulaire de contact sans quitter Never Go Alone. Il permet à l’équipe de te recontacter au lancement. Google Forms ne peut pas confirmer automatiquement une réponse dans le prototype.", "Complete this contact form without leaving Never Go Alone. It lets the team contact you at launch. Google Forms cannot automatically confirm a response inside the prototype.")) + "</div>" +
          googleFormEmbed() +
          "<button type='button' class='primary' data-action='home'>" + esc(i18n("Retourner à l’accueil", "Return to Home")) + "</button>" +
          (rememberedWithdrawal(event) ? "<button type='button' class='primary ghost withdraw-button' data-action='withdraw'>" + esc(i18n("Retirer mon intérêt", "Remove my interest")) + "</button>" : "") +
          "<p id='withdraw-feedback' class='feedback' role='status' aria-live='polite'></p>" +
          "</div></section>";
      }

      function groupPage() {
        var reservation = activeReservation();
        if (!reservation) return eventDetail();
        var content = reservation.groupTab === "chat" ? groupChat() : reservation.groupTab === "members" ? groupMembers() : ticketTab();
        return "<section class='view'>" + homeHeader("Le groupe") +
          "<div class='tabs'>" + [
            ["chat", "Discussion"],
            ["members", "Membres"],
            ["ticket", "Billet"]
          ].map(function (tab) {
            return "<button type='button' data-action='group-tab' data-tab='" + tab[0] + "' class='" +
              (reservation.groupTab === tab[0] ? "active" : "") + "'>" + tab[1] + "</button>";
          }).join("") + "</div>" + content + "</section>";
      }

      function groupChat() {
        var restaurants = ["Café du quartier", "Brasserie des amis", "Le Petit Bercy"];
        var event = groupEvent();
        var reservation = activeReservation();
        return "<div class='scroll'>" + reservation.messages.map(function (message) {
          return "<div class='message " + (message.mine ? "mine" : "") + "'>" +
            "<span class='chat-author'>" + esc(message.author) + "</span>" + esc(message.text) + "</div>";
        }).join("") +
          "<div class='notice-card'><b>🍽 Se rencontrer avant</b><p>Choisis un endroit près de " + esc(eventVenue(event)) + " pour discuter avant l'événement.</p>" +
          restaurants.map(function (restaurant) {
            return "<button type='button' class='restaurant' data-action='restaurant' data-restaurant='" + esc(restaurant) + "'>" +
              "<span>🍴 " + esc(restaurant) + "</span><span>" +
              (reservation.restaurant === restaurant ? "Proposé ✓" : "Proposer") + "</span></button>";
          }).join("") + "</div><div class='chat-composer'><input id='chat-input' maxlength='160' placeholder='Écrire au groupe…'>" +
          "<button type='button' data-action='send-message' aria-label='Envoyer le message'>↑</button></div></div>";
      }

      function groupMembers() {
        return "<div class='scroll'><p class='muted'>Vous êtes " + groupEvent().current +
          " personnes intéressées. Appuie sur un membre pour voir son profil.</p><p class='muted'>Tous les membres du groupe restent visibles, quelle que soit la préférence d’âge.</p>" + memberList() + "</div>";
      }

      function ticketTab() {
        var event = groupEvent();
        var reservation = activeReservation();
        var confirmed = reservation.keepSmallGroup || event.current >= event.minimum;
        var paymentAvailable = confirmed && reservation.day === "J-7" && !reservation.paid;
        var steps = [
          ["Intérêt enregistré", true],
          ["Groupe lancé", confirmed],
          ["Confirmation à J-7", reservation.day === "J-7"],
          ["Billet", reservation.paid]
        ];
        var html = "<div class='scroll'><div class='timeline'>" + steps.map(function (step) {
          return "<div class='timeline-step " + (step[1] ? "done" : "") + "'>" + step[0] + "</div>";
        }).join("") + "</div><div class='field'><label for='simulation-day'>Simuler la date</label>" +
          "<select id='simulation-day'><option value='J-14'" + (reservation.day === "J-14" ? " selected" : "") + ">J-14</option>" +
          "<option value='J-7'" + (reservation.day === "J-7" ? " selected" : "") + ">J-7</option></select></div>";

        if (!confirmed) {
          html += "<div class='status neutral'>Le groupe peut choisir d'y aller même sans atteindre le tarif groupe.</div>" +
            "<button type='button' class='primary' data-action='keep-small'>On maintient la sortie à " + event.current + "</button>";
        } else if (reservation.paid) {
          html += "<div class='status'>✓ Billet confirmé. Rendez-vous 30 min avant l'événement.</div>" +
            "<div class='qr' aria-label='QR code fictif'>NGA-2026</div>";
        } else if (paymentAvailable) {
          html += "<div class='status'>Le groupe est prêt : confirme ta place pour déclencher le paiement.</div>" +
            "<button type='button' class='primary' data-action='pay'>Confirmer et payer " +
            (event.groupPrice + 2.5).toFixed(2).replace(".", ",") + " €</button>";
        } else {
          html += "<div class='status neutral'>Paiement disponible à J-7 seulement.</div>";
        }

        html += "<button type='button' class='primary ghost' style='margin-top:10px' data-action='leave'>Quitter le groupe</button>";
        if (reservation.leaveMessage) html += "<div class='notice-card'><b>Avant de quitter</b><p>" + esc(reservation.leaveMessage) + "</p></div>";
        return html + "</div>";
      }

      function groups() {
        var joinedIndexes = joinedEventIndexes();
        if (!joinedIndexes.length) {
          return "<section class='view'>" + header("Mes groupes") + "<div class='scroll'><div class='empty'><h2>Ton prochain plan t'attend.</h2>" +
            "<p>Rejoins une sortie pour discuter avec le groupe et organiser un moment avant l'événement.</p>" +
            "<button type='button' class='primary' data-action='explore'>Explorer</button></div></div>" + bottomNav("groups") + "</section>";
        }
        return "<section class='view'>" + header("Mes groupes") + "<div class='scroll'><div class='event-list'>" + joinedIndexes.map(function (index) {
          var event = events[index];
          return "<button type='button' class='event-card' data-action='open-group' data-event-id='" + index + "'>" +
            poster(event) + "<div class='event-copy'><h3>" + esc(event.title) +
            "</h3><p>Discussion, membres, billet et rendez-vous avant la sortie.</p></div></button>";
        }).join("") + "</div></div>" + bottomNav("groups") + "</section>";
      }

      function profile() {
        return "<section class='view'>" + header("Mon profil") + "<div class='scroll'><div class='profile-hero'>" +
          "<span class='avatar avatar-4' aria-hidden='true'>A</span><h1>Alex Martin</h1><p class='muted'>24 ans · " + esc(state.city) + "</p></div>" +
          "<div class='profile-card'><b>Identité vérifiée</b><p>Profil vérifié · tes coordonnées servent uniquement à être recontacté·e.</p></div>" +
          "<div class='language-picker' aria-label='Choisir la langue'><span>Langue</span>" +
          "<button type='button' data-action='set-locale' data-locale='fr' aria-pressed='" + (state.locale === "fr") + "' class='" + (state.locale === "fr" ? "active" : "") + "'>Français</button>" +
          "<button type='button' data-action='set-locale' data-locale='en' aria-pressed='" + (state.locale === "en") + "' class='" + (state.locale === "en" ? "active" : "") + "'>English</button></div>" +
          "<button type='button' class='primary gold' data-action='waitlist'>✦ Être averti·e du lancement</button>" +
          "<div style='height:8px'></div><button type='button' class='primary' data-action='about'>À propos</button>" +
          "<div style='height:8px'></div><button type='button' class='primary ghost' data-action='toggle-dark'>" +
          (state.dark ? "Passer en mode clair" : "Passer en mode sombre") + "</button></div>" + bottomNav("profile") + "</section>";
      }

      function waitlist() {
        return "<section class='view'>" + header("Être averti·e") + interestForm() + "</section>";
      }

      function googleFormEmbed() {
        var googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeoXqtJ7WOj_NkDK2kqRJa8Fey_msSvvU62978PLLdd5iaNNg/viewform";
        var embeddedFormUrl = googleFormUrl + "?embedded=true";
        return "<iframe class='google-form' title='Formulaire Never Go Alone' src='" + embeddedFormUrl + "' loading='lazy'>Chargement du formulaire…</iframe>";
      }

      function interestForm(event) {
        var selectedEventNote = event ? "<div class='info-card'><b>" + esc(event.title) + "</b><p>Tu nous dis que cette sortie t’intéresse. Nous te recontacterons quand l’application sera lancée.</p></div>" : "";
        return "<div class='scroll'><h1>Tu veux être averti·e ?</h1>" +
          "<p class='muted'>Laisse tes coordonnées ici, sans quitter le prototype.</p>" + selectedEventNote +
          "<div class='form-note'>Les réponses sont collectées directement dans le Google Form du projet. " +
          "Les alertes e-mail sont gérées dans ses paramètres Google Forms.</div>" +
          googleFormEmbed() +
          "</div>";
      }

      function about() {
        return "<section class='view'>" + header("À propos") + "<div class='scroll'><h1>Ne plus renoncer à une sortie.</h1>" +
          "<p class='muted'>Never Go Alone aide les jeunes adultes, les personnes nouvelles dans une ville et les étudiant·es internationaux à vivre les événements qui les tentent.</p>" +
          "<div class='info-card'><b>Notre idée</b><p>Un intérêt commun est une bonne première raison de se rencontrer. " +
          "Cette version live permet de repérer une sortie, de découvrir les profils intéressés et de signaler son intérêt.</p></div>" +
          "<div class='info-card'><b>Ce qui compte</b><p>Les profils affichent uniquement un prénom, une activité indiquée et un avatar illustré. Les coordonnées restent privées.</p></div>" +
          "<div class='private-lock'><b>Une version de test</b><p>Never Go Alone est encore en prototype. Après avoir rejoint une sortie, le formulaire de contact permet de recevoir les nouvelles du lancement.</p></div>" +
          "</div></section>";
      }

      function cityPage() {
        return "<section class='view'>" + header("Changer de ville") + "<div class='scroll'><h1>Où veux-tu sortir ?</h1>" +
          "<p class='muted'>Choisis une ville en France pour voir les sorties proposées.</p>" +
          Object.keys(venues).map(function (city) {
            return "<button type='button' class='city-row' data-action='select-city' data-city='" + esc(city) + "'>" +
              "<b>" + esc(city) + "</b><span>" + (city === state.city ? "Choisie ✓" : "Voir les sorties ›") + "</span></button>";
          }).join("") + "</div></section>";
      }

      function render() {
        document.body.classList.toggle("dark", state.dark);
        var views = {
          explore: explore,
          event: eventDetail,
          people: peoplePreview,
          "member-profile": memberProfile,
          join: joinPage,
          contact: contactPage,
          profile: profile,
          waitlist: waitlist,
          about: about,
          city: cityPage
        };
        app.innerHTML = (views[state.screen] || explore)();
        applyLocale();
      }

      app.addEventListener("click", function (event) {
        var control = event.target.closest("[data-action]");
        if (!control) return;
        var action = control.dataset.action;

        if (action === "back") back();
        if (action === "home") {
          state.history = [];
          state.screen = "explore";
          render();
        }
        if (action === "nav") navigate(control.dataset.screen);
        if (action === "explore") navigate("explore");
        if (action === "profile") navigate("profile");
        if (action === "city") navigate("city");
        if (action === "select-city") selectCity(control.dataset.city);
        if (action === "filter") { state.filter = control.dataset.filter || "Tout"; render(); }
        if (action === "open-event") {
          var eventId = Number(control.dataset.eventId);
          if (Number.isInteger(eventId) && events[eventId]) {
            state.eventIndex = eventId;
            navigate("event");
            loadLiveEvent(selectedEvent());
          }
        }
        if (action === "people") {
          navigate("people");
          loadLiveEvent(selectedEvent());
        }
        if (action === "open-member") openMemberProfile(control.dataset.memberId);
        if (action === "set-age-preference") {
          var selectedAgePreference = control.dataset.agePreference || "all";
          state.agePreference = ["all", "18-23", "24-26", "27-30"].indexOf(selectedAgePreference) >= 0 ? selectedAgePreference : "all";
          render();
        }
        if (action === "join") navigate("join");
        if (action === "withdraw") withdrawLiveInterest();
        if (action === "waitlist") navigate("waitlist");
        if (action === "about") navigate("about");
        if (action === "toggle-dark") { state.dark = !state.dark; render(); }
        if (action === "set-locale") {
          state.locale = control.dataset.locale === "en" ? "en" : "fr";
          render();
        }
      });

      app.addEventListener("input", function (event) {
        var input = event.target;
        if (input.id === "card-number") {
          input.value = input.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
        }
        if (input.id === "card-expiry") {
          var expiry = input.value.replace(/\D/g, "").slice(0, 4);
          input.value = expiry.length > 2 ? expiry.slice(0, 2) + "/" + expiry.slice(2) : expiry;
        }
        if (input.id === "card-cvc") input.value = input.value.replace(/\D/g, "").slice(0, 3);
      });

      app.addEventListener("change", function (event) {
        if (event.target.id === "simulation-day") {
          var ticketGroup = activeReservation();
          if (!ticketGroup) return;
          ticketGroup.day = event.target.value;
          ticketGroup.leaveMessage = "";
          render();
        }
      });

      app.addEventListener("submit", function (event) {
        if (event.target && event.target.id === "live-interest-form") {
          event.preventDefault();
          submitLiveInterest();
        }
      });

      function joinFieldValue(id) {
        var input = app.querySelector("#" + id);
        return input ? String(input.value || "").trim() : "";
      }

      function setJoinFeedback(message) {
        var feedback = app.querySelector("#live-join-feedback");
        if (feedback) feedback.textContent = message || "";
      }

      async function submitLiveInterest() {
        var form = app.querySelector("#live-interest-form");
        if (!form || state.joinStatus === "sending") return;
        var firstName = joinFieldValue("live-first-name");
        var lastName = joinFieldValue("live-last-name");
        var email = joinFieldValue("live-email").toLowerCase();
        var activity = joinFieldValue("live-activity");
        var gender = joinFieldValue("live-gender") || "unspecified";
        var website = joinFieldValue("live-website");
        var adult = !!(app.querySelector("#live-adult") || {}).checked;
        var publicConsent = !!(app.querySelector("#live-public-consent") || {}).checked;
        var contactConsent = !!(app.querySelector("#live-contact-consent") || {}).checked;
        var emailLooksValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        if (!firstName || !lastName || !activity || !emailLooksValid) {
          setJoinFeedback(i18n("Renseigne ton prénom, ton nom, ton e-mail et ton activité.", "Enter your first name, last name, email and activity."));
          return;
        }
        if (!adult || !publicConsent || !contactConsent) {
          setJoinFeedback(i18n("Confirme les trois cases pour ajouter ton profil au groupe.", "Confirm all three checkboxes to add your profile to the group."));
          return;
        }

        state.joinStatus = "sending";
        setJoinFeedback(i18n("Enregistrement de ton intérêt…", "Saving your interest…"));
        var submitButton = form.querySelector("button[type='submit']");
        if (submitButton) submitButton.disabled = true;
        try {
          var event = selectedEvent();
          var payload = await apiRequest("/api/interests", {
            method: "POST",
            headers: { "content-type": "application/json", "accept": "application/json" },
            body: JSON.stringify({
              eventId: event.id,
              firstName: firstName,
              lastName: lastName,
              email: email,
              gender: gender,
              activity: activity,
              adult: adult,
              publicConsent: publicConsent,
              contactConsent: contactConsent,
              website: website
            })
          });
          applyLiveEvent(event, payload);
          if (payload.member && payload.withdrawToken) rememberWithdrawal(event, payload.member.id, payload.withdrawToken);
          state.joinStatus = "";
          state.history = [];
          state.screen = "contact";
          render();
        } catch (error) {
          state.joinStatus = "";
          setJoinFeedback(error && error.message ? error.message : i18n("Impossible d’enregistrer ton intérêt pour le moment.", "We could not save your interest right now."));
          if (submitButton) submitButton.disabled = false;
        }
      }

      async function withdrawLiveInterest() {
        var event = selectedEvent();
        var remembered = rememberedWithdrawal(event);
        var feedback = app.querySelector("#withdraw-feedback");
        if (!remembered || !remembered.token) {
          if (feedback) feedback.textContent = i18n("Cette session ne peut plus retirer ce profil. Contacte l’équipe si besoin.", "This session can no longer remove this profile. Contact the team if needed.");
          return;
        }
        if (feedback) feedback.textContent = i18n("Retrait de ton intérêt…", "Removing your interest…");
        try {
          var payload = await apiRequest("/api/interests/withdraw", {
            method: "POST",
            headers: { "content-type": "application/json", "accept": "application/json" },
            body: JSON.stringify({ eventId: event.id, token: remembered.token })
          });
          applyLiveEvent(event, payload);
          clearRememberedWithdrawal(event);
          state.history = [];
          state.screen = "event";
          render();
          loadLiveEvent(event);
        } catch (error) {
          if (feedback) feedback.textContent = error && error.message ? error.message : i18n("Impossible de retirer ton intérêt pour le moment.", "We could not remove your interest right now.");
        }
      }

      function reservePlace() {
        var card = app.querySelector("#card-number");
        var consent = app.querySelector("#payment-consent");
        var feedback = app.querySelector("#reservation-feedback");
        var digits = card ? card.value.replace(/\D/g, "") : "";
        if (digits.length !== 16 || !consent || !consent.checked) {
          if (feedback) feedback.textContent = "Renseigne les 16 chiffres fictifs et ton accord pour réserver.";
          return;
        }
        var event = selectedEvent();
        if (!hasJoinedEvent(state.eventIndex)) {
          createReservation(state.eventIndex);
          event.current += 1;
        }
        state.history = [];
        state.screen = "group";
        render();
      }

      function nextResponder(reservation) {
        var responders = ["Maya", "Jonas", "Sofia"];
        var group = reservation || activeReservation() || newReservation();
        var ownMessageCount = group.messages.filter(function (message) { return message.mine; }).length;
        return responders[Math.max(0, ownMessageCount - 1) % responders.length];
      }

      function normalizeForReply(value) {
        return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      function messageExcerpt(value) {
        var excerpt = String(value || "").replace(/\s+/g, " ").trim();
        return excerpt.length > 54 ? excerpt.slice(0, 51) + "…" : excerpt;
      }

      function contextualReply(message, event) {
        var text = normalizeForReply(message);
        var currentEvent = event || groupEvent();
        var venue = eventVenue(currentEvent);
        var date = eventDate(currentEvent);
        var english = state.locale === "en";
        if (/(restaurant|resto|brunch|cafe|bar|manger|diner|dejeuner)/.test(text)) {
          return english ? "Great idea — I’m up for meeting near " + venue + " before " + currentEvent.title + "." : "Très bonne idée — je suis partant·e pour se retrouver près de " + venue + " avant " + currentEvent.title + ".";
        }
        if (/(heure|horaire|quand|rendez[ -]?vous|rdv|arriv)/.test(text)) {
          return english ? "That works for me. Shall we meet 30 minutes before at " + venue + "?" : "Ça me va. On se retrouve 30 min avant à " + venue + " ?";
        }
        if (/(metro|transport|train|bus|voiture|covoiturage|trajet)/.test(text)) {
          return english ? "I’ll check the route to " + venue + ". We can meet at the entrance and go in together." : "Je regarde aussi l’itinéraire vers " + venue + ". On peut se retrouver à l’entrée et y aller ensemble.";
        }
        if (/(billet|payer|paiement|prix|reservation|reserver)/.test(text)) {
          return english ? "For tickets, nothing is charged today; confirmation happens at D-7. We can sort the details out here." : "Côté billet, rien n’est débité aujourd’hui ; la confirmation se fait à J-7. On peut régler les détails ici.";
        }
        if (/(salut|bonjour|hello|coucou)/.test(text)) {
          return english ? "Hi! Welcome to the group for " + currentEvent.title + ". Looking forward to planning it together." : "Salut ! Bienvenue dans le groupe pour " + currentEvent.title + ". Hâte de préparer ça ensemble.";
        }
        if (/\?$/.test(String(message || "").trim())) {
          return english ? "Good question. Let’s decide together in the chat before " + date + "." : "Bonne question. On peut en décider ensemble ici avant " + date + ".";
        }
        return english ? "I like that idea: “" + messageExcerpt(message) + "”. We can organise it together before " + date + "." : "J’aime bien cette idée : « " + messageExcerpt(message) + " ». On peut s’organiser ensemble avant " + date + ".";
      }

      function sendMessage() {
        var input = app.querySelector("#chat-input");
        if (!input || !input.value.trim()) return;
        var reservation = activeReservation();
        if (!reservation) return;
        var message = input.value.trim();
        reservation.messages.push({ author: "Alex", text: message, mine: true });
        reservation.messages.push({ author: nextResponder(reservation), text: contextualReply(message, groupEvent()), mine: false });
        render();
      }

      function showLeaveRule() {
        var reservation = activeReservation();
        if (!reservation) return;
        if (!reservation.paid) {
          reservation.leaveMessage = "Tu peux quitter librement avant le paiement : aucun débit n'a été effectué.";
        } else if (reservation.day === "J-14") {
          reservation.leaveMessage = "Avant J-7, le billet est remboursé hors frais de service.";
        } else {
          reservation.leaveMessage = "Après la confirmation à J-7, le billet est non remboursable sauf si une personne reprend ta place.";
        }
        render();
      }

      render();
      loadLiveCounts();
      window.addEventListener("focus", function () {
        loadLiveCounts();
        if (state.screen === "event" || state.screen === "people" || state.screen === "member-profile" || state.screen === "contact") {
          loadLiveEvent(selectedEvent());
        }
      });
    }());
  </script>
</body>
</html>
